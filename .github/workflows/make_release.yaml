on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'The tag to use, defaults to VERSION-BUILD'
        required: false
        type: string
      BUILD:
        description: 'The build number to use'
        required: false
        type: number
        default: 1

env:
  REGISTRY: "ghcr.io/marcinmajsc/pve-backup-server-dockerfiles"
  TAG: ${{ inputs.TAG }}

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Define TAG
      if: ${{ !inputs.TAG }}
      run: echo "TAG=$(cat VERSION)-${{ inputs.BUILD }}" >> $GITHUB_ENV
    - name: Login to Docker Hub
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Update the dockerhub tags
    - name: Create semver manifest
      run: ./release.bash "${{ env.REGISTRY }}:${{ env.TAG }}" manifest semver beta latest

    # Create release
    - name: Make it latest
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: ${{ env.TAG }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
